services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alche}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alche}
      POSTGRES_DB: ${POSTGRES_DB:-alche}
      TZ: ${TZ:-Indian/Mauritius}
    volumes:
      - alche_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        BUILD_VERSION: ${BUILD_VERSION:-dev}
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 8000
      DATABASE_URL: ${DATABASE_URL:-postgresql://alche:alche@db:5432/alche?schema=public}
      TZ: ${TZ:-Indian/Mauritius}
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    profiles: ['tls']
    ports:
      - '443:443'
      - '80:80'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  alche_pgdata:
  caddy_data:
  caddy_config:
