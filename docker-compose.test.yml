services:
  db:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alche}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']

  test-api:
    profiles: ['test']
    build:
      context: .
      target: test
    env_file:
      - .env
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://${POSTGRES_USER:-alche}:${POSTGRES_PASSWORD:-alche}@db:5432/alche_test?schema=public
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER:-alche}:${POSTGRES_PASSWORD:-alche}@db:5432/alche_test?schema=public
      SECRET_KEY: test-secret-key-0123456789abcdef
      TZ: Indian/Mauritius
    depends_on:
      db:
        condition: service_healthy
    command: ['pnpm', '--filter', '@alche/api', 'test']

  test-web:
    profiles: ['test']
    build:
      context: .
      target: build
    command: ['pnpm', '--filter', '@alche/web', 'test']
    environment:
      CI: 'true'
